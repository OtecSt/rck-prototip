# «Агент-цех» — reverse proxy → gunicorn (сервис app:8000 в сети compose).
# Базовая авторизация: файл /etc/nginx/.htpasswd генерируется deploy.sh
# из переменных BASIC_AUTH_USER / BASIC_AUTH_PASSWORD.

upstream agent_ceh {
    server app:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Загрузка Excel до 20 МБ в приложении — здесь запас 25 МБ
    client_max_body_size 25M;

    # Security-заголовки
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Для certbot (проверка домена ACME) — при включении TLS раскомментировать:
    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }

    location / {
        auth_basic "Agent-ceh";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://agent_ceh;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Расчёты ядер длинные — держим запас как у gunicorn (120 с)
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }
}

